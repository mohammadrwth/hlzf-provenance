# Golden label for wunsiedel-2024 (SWW Wunsiedel GmbH 2024)
# Label from the PDF only, without looking at the pipeline's output. For every grid level x
# season write the printed windows as "HH:MM-HH:MM" strings, or [] if the cell is printed
# empty. Delete cells the table does not have; add levels it has. Then set verified: true and
# your name in labeled_by.
#
# convention: interval_start | interval_end_physical | interval_end_labels |
#             interval_end_ambiguous | assumed    (definitions: src/hlzf/models.py, Convention)
# rules: kinds and value formats as in src/hlzf/prompts.py, e.g.
#   {kind: bridge_days, value: working_day}, {kind: min_kw_diff, value: 100},
#   {kind: holiday_handling, value: {states: [BY], mode: union, exclude: []}}
# Chosen as: the simple one.
document: wunsiedel-2024
labeled_by: 'Mo'
verified: true
convention: ''
cells:
- grid_level: NE5
  season: winter
  windows: [16:00-19:00]
- grid_level: NE5
  season: spring
  windows: []
- grid_level: NE5
  season: summer
  windows: []
- grid_level: NE5
  season: autumn
  windows: []
- grid_level: NE6
  season: winter
  windows: [8:30-9:30, 11:00-14:00]
- grid_level: NE6
  season: spring
  windows: []
- grid_level: NE6
  season: summer
  windows: []
- grid_level: NE6
  season: autumn
  windows: [17:00-20:00]
- grid_level: NE7
  season: winter
  windows: [11:00-14:00]
- grid_level: NE7
  season: spring
  windows: [11:00-14:00]
- grid_level: NE7
  season: summer
  windows: []
- grid_level: NE7
  season: autumn
  windows: [17:00-20:00]
rules:
- kind: workdays_only
  value: true
