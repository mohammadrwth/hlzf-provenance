[project]
name = "hlzf-provenance"
version = "0.3.2"
description = "Grounded, provenance-tracked extraction of Hochlastzeitfenster (HLZF) from German DSO publications"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Mohammad Abdel Aziz" }]
dependencies = [
    "pydantic>=2.7",
    "typer>=0.12",
    "pymupdf>=1.24",
    "pdfplumber>=0.11",
    "rapidfuzz>=3.9",
    "holidays>=0.57",
    "openai>=1.40",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "rich>=13.7",
]

[project.scripts]
hlzf = "hlzf.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
    "prov>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hlzf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["B008"]
